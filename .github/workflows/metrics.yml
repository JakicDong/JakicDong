name: Generate metrics

on:
  schedule:
    - cron: "30 16 * * *" # every day at 00:30 Beijing time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Render metrics.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: JakicDong
          template: classic
          filename: metrics.svg
          output_action: commit
          committer_message: "chore: update metrics [skip ci]"
          base: header, activity, community
          config_timezone: Asia/Shanghai
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 6
          plugin_languages_ignored: html, css, scss, less, cmake, makefile, dockerfile, shell, batchfile, tex
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
